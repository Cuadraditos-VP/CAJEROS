<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cajeros v39</title>
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cajeros">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d0d7de;
      --header-bg: #1e3a5f;
      --name-col: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* iPhone/Safari: evitar que el enfoque de campos de texto provoque zoom automático */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    input, textarea, select, button {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    #shiftComment {
      font-size: 16px !important;
      line-height: 1.35;
      -webkit-appearance: none;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #1f2937;
      line-height: 1.4;
      padding: 16px 8px 60px;
    }
    .container {
      max-width: none;
      margin: 0 auto;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; margin-bottom: 8px; width: 100%; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #1e3a5f; }
    header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }
    .title-short { display: none; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .view-original-btn {
      margin-top: 0;
      border: 0;
      border-radius: 7px;
      padding: 7px 12px;
      background: #7c3aed;
      color: white;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
    }
    footer { display: none !important; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 10px 0 4px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px 3px 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #334155;
    }
    .legend-item .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .group {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 0 auto 24px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 100%;
    }
    .group-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
      color: white;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .group-header span {
      background: rgba(255,255,255,0.18);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 0;
      font-size: 0.75rem;
    }
    thead th {
      background: var(--header-bg);
      color: #fff;
      font-weight: 600;
      padding: 8px 3px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 45;
      border-bottom: 2px solid #0f2744;
      white-space: nowrap;
      height: 52px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    /* Encabezados de día (fecha/número) en gris medio, con el finde suavizado */
    thead th:not(.sticky-col):not(.sticky-col-2) {
      background: #64748b;
      border-bottom: 2px solid #475569;
    }
    thead th.day-num { font-size: 0.85rem; font-weight: 500; }
    thead th.weekend { background: #94a3b8; }
    th.sticky-col, td.sticky-col {
      position: sticky; left: 0; z-index: 10; background: var(--name-col);
    }
    th.sticky-col-2, td.sticky-col-2 {
      position: sticky; left: 68px; z-index: 10; background: var(--name-col);
      border-right: 2px solid var(--border);
    }
    th.sticky-col, td.sticky-col {
      left: 0;
      z-index: 25;
    }
    th.sticky-col {
      background: var(--header-bg);
    }
    th.sticky-col-2, td.sticky-col-2 {
      left: var(--col-legajo);
      z-index: 25;
    }
    th.sticky-col-2 {
      background: var(--header-bg); text-align: left; padding-left: 8px;
    }
    tbody td {
      text-align: center;
      padding: 6px 3px;
      border: 1px solid #e5e7eb;
      font-weight: 600;
      font-size: 1.05rem;
      min-width: 48px;
      height: 39px;
      box-sizing: border-box;
      cursor: pointer;
      transition: filter 0.1s;
    }
    tbody td:hover { filter: brightness(0.93); }
    tbody tr:nth-child(even) td.sticky-col,
    tbody tr:nth-child(even) td.sticky-col-2 { background: #f1f5f9; }
    td.sticky-col {
      font-weight: 600; color: #475569; font-size: 0.72rem; border-right: none;
    }
    td.sticky-col-2 {
      text-align: left; padding-left: 8px; font-weight: 600;
      color: #1e293b; font-size: 0.78rem; white-space: nowrap;
    }
    td.empty { background: #fafafa; color: #cbd5e1; cursor: default; }
    /* Comentario: puntito negro fijo (elemento hijo, no ::after, para no chocar con "editado") */
    td.has-comment,
    .cal-day,
    .cal-day-h {
      position: relative;
      overflow: visible;
    }
    .comment-dot {
      position: absolute !important;
      right: 3px;
      bottom: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px rgba(0,0,0,0.25);
      pointer-events: none;
      z-index: 8;
      flex: none;
      display: block;
    }
    .palette-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .palette-overlay.open { display: flex !important; }
    #shiftOverlay { z-index: 1100; }
    .palette-modal {
      background: white;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      padding: 18px;
    }
    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .palette-header h3 {
      font-size: 1rem;
      color: #1e293b;
    }
    .palette-header .code-badge {
      background: #1e3a5f;
      color: white;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #64748b;
      line-height: 1;
    }
    .close-btn:hover { background: #e2e8f0; color: #1e293b; }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .shift-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .shift-option {
      padding: 12px 4px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: center;
      background: #f1f5f9;
      color: #334155;
      transition: transform 0.12s, border-color 0.12s;
      user-select: none;
    }
    .shift-option:hover { transform: scale(1.05); border-color: #1e293b; }
    .shift-option.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.4);
    }
    /* Turno en edición: el CASILLERO DEL ALMANAQUE INDIVIDUAL titila hasta "Listo" */
    @keyframes pendingShiftBlink {
      0%, 100% {
        outline: 4px solid rgba(37,99,235,1);
        box-shadow: 0 0 0 4px rgba(37,99,235,0.35), 0 0 14px 4px rgba(37,99,235,0.55);
        transform: scale(1.02);
      }
      50% {
        outline: 4px solid transparent;
        box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent;
        transform: scale(1);
      }
    }
    .cal-day.pending-shift,
    .cal-day-h.pending-shift {
      animation: pendingShiftBlink 0.7s ease-in-out infinite !important;
      position: relative;
      z-index: 20;
    }
    #originalBanner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #78350f;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
      width: 100%;
    }
    .palette-color {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      position: relative;
    }
    .palette-color:hover {
      transform: scale(1.08);
      border-color: #1e293b;
    }
    .palette-color.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.4);
    }
    .palette-color .hex-label {
      position: absolute;
      bottom: 2px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.55rem;
      font-weight: 600;
      color: rgba(0,0,0,0.55);
      text-shadow: 0 0 3px white;
      pointer-events: none;
    }
    .palette-actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-clear {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-clear:hover { background: #e2e8f0; }
    .btn-done {
      background: #1e3a5f;
      color: white;
    }
    .btn-done:hover { background: #16304f; }

    .group-body {
      display: flex;
      gap: 0;
      align-items: stretch;
    }
    .group-body .table-wrap {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
    }
    .group-body .counts-wrap {
      flex: 0 0 auto;
      border-left: 3px solid #1e3a5f;
      overflow: hidden;
    }
    .group-body .counts-wrap table {
      min-width: 0;
      width: auto;
      border-collapse: collapse;
    }
    /* Match EXACTLY the main table cell metrics */
    .group-body .counts-wrap thead th {
      background: #2a4a73;
      color: #fff;
      font-weight: 600;
      font-size: 0.65rem;
      padding: 7px 2px;
      text-align: center;
      border-bottom: 2px solid #0f2744;
      white-space: nowrap;
      min-width: 30px;
      width: 30px;
      line-height: 1.25;
      height: 40px;          /* approx 2-line header height */
      box-sizing: border-box;
    }
    .group-body .counts-wrap tbody td {
      text-align: center;
      padding: 4px 2px;
      border: 1px solid #e5e7eb;
      font-weight: 600;
      font-size: 0.7rem;
      min-width: 30px;
      width: 30px;
      height: 26px;
      box-sizing: border-box;
    }
    /* Force main table body cells to same fixed height */
    .group-body .table-wrap tbody td {
      height: 26px;
      box-sizing: border-box;
    }
    .group-body .table-wrap thead th {
      height: 40px;
      box-sizing: border-box;
    }
    .hint {

      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    footer {
      text-align: center;
      margin-top: 12px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  
    #summaryTable {
      table-layout: auto;
    }
    #summaryTable thead th:not(.sticky-col):not(.sticky-col-2) {
      min-width: 30px;
      width: 30px;
    }
    #summaryTable tbody td:not(.sticky-col):not(.sticky-col-2) {
      min-width: 30px;
      width: 30px;
      height: 26px;
      box-sizing: border-box;
    }

  
    /* ========== STRICT COLUMN ALIGNMENT ========== */
    :root {
      --col-legajo: 68px;
      --col-nombre: 130px;
      --col-day: 42px;
      --days-total: 1260px; /* 30 * 42 */
    }

    table {
      table-layout: fixed;
      border-collapse: collapse;
    }

    /* Sticky columns – same everywhere */
    th.sticky-col, td.sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
      width: var(--col-legajo) !important;
      min-width: var(--col-legajo) !important;
      max-width: var(--col-legajo) !important;
      box-sizing: border-box;
    }
    th.sticky-col {
      background: var(--header-bg);
      z-index: 25;
    }
    td.sticky-col {
      background: var(--name-col);
    }
    tbody tr:nth-child(even) td.sticky-col {
      background: #f1f5f9;
    }

    th.sticky-col-2, td.sticky-col-2 {
      position: sticky;
      left: var(--col-legajo);
      z-index: 10;
      width: var(--col-nombre) !important;
      min-width: var(--col-nombre) !important;
      max-width: var(--col-nombre) !important;
      box-sizing: border-box;
      border-right: 2px solid var(--border);
    }
    th.sticky-col-2 {
      background: var(--header-bg);
      z-index: 25;
      text-align: left;
      padding-left: 8px;
    }
    td.sticky-col-2 {
      background: var(--name-col);
      text-align: left;
      padding-left: 8px;
    }
    tbody tr:nth-child(even) td.sticky-col-2 {
      background: #f1f5f9;
    }

    /* Separador de semana (entre DO y LU) — nunca corta un bloque LAO, porque ese bloque es una sola celda */
    .week-sep {
      border-left: 3px solid #334155 !important;
    }
    /* Bloque de vacaciones (LAO) fusionado en una sola celda */
    td.lao-block {
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }

    /* Day columns – identical width everywhere (main + summary) */
    thead th:not(.sticky-col):not(.sticky-col-2):not(.day-only),
    tbody td:not(.sticky-col):not(.sticky-col-2):not(.day-only) {
      width: var(--col-day) !important;
      min-width: var(--col-day) !important;
      max-width: var(--col-day) !important;
      box-sizing: border-box;
      padding: 6px 2px;
      overflow: hidden;
    }
    thead th:not(.sticky-col):not(.sticky-col-2) {
      padding: 8px 2px;
      height: 52px;
    }
    tbody td:not(.sticky-col):not(.sticky-col-2) {
      height: 39px;
    }

    /* Main schedule tables width = sticky + sticky2 + días del mes (--days-total lo fija el JS) */
    .group-body .table-wrap table {
      width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      min-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      max-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
    }

    /* Summary table same width formula */
    #summaryTable {
      width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      min-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
    }

    /* Side counts – fixed narrow columns, do not affect day alignment */
    .group-body {
      display: flex;
      align-items: flex-start;
      gap: 0;
      padding: 0;
    }
    .group-body .table-wrap {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Conteo por jefe: se muestra como tabla independiente, separada de la programación */
    .group-body .counts-wrap {
      flex: 0 0 auto;
      margin-left: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow: hidden;
      background: #fff;
    }
    .group-body .counts-wrap table {
      width: auto;
      table-layout: fixed;
    }
    .group-body .counts-wrap thead th {
      background: #2a4a73;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      width: 42px !important;
      min-width: 42px !important;
      max-width: 42px !important;
      padding: 8px 2px;
      box-sizing: border-box;
      border: 1px solid transparent;
      border-bottom: 2px solid #0f2744;
      line-height: 1.25;
      vertical-align: middle;
    }
    .group-body .counts-wrap tbody td {
      width: 42px !important;
      min-width: 42px !important;
      max-width: 42px !important;
      padding: 6px 2px;
      box-sizing: border-box;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      border: 1px solid #e5e7eb;
      vertical-align: middle;
    }
    .group-body .counts-wrap tbody tr:last-child td { border-bottom: none; }
    .group-body .counts-wrap tbody td:last-child { border-right: none; }

  
    /* Toggle buttons */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e3a5f;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin: 4px 6px 4px 0;
    }
    .toggle-btn:hover { background: #16304f; }
    .toggle-btn .arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 0.75rem;
    }
    .toggle-btn.collapsed .arrow { transform: rotate(-90deg); }
    .toggle-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 14px;
      align-items: center;
    }
    .collapsible.hidden-section { display: none !important; }
    .counts-wrap.hidden-section { display: none !important; }

  
    .gnum {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

  
    /* Frozen name panel */
    th.sticky-col, td.sticky-col,
    th.sticky-col-2, td.sticky-col-2 {
      position: sticky !important;
      z-index: 30 !important;
      box-shadow: 2px 0 6px rgba(0,0,0,0.08);
    }
    th.sticky-col, th.sticky-col-2 {
      z-index: 40 !important;
      background: var(--header-bg) !important;
    }
    td.sticky-col, td.sticky-col-2 {
      background: #f8fafc !important;
    }
    tbody tr:nth-child(even) td.sticky-col,
    tbody tr:nth-child(even) td.sticky-col-2 {
      background: #eef2f7 !important;
    }

  
    #perPersonTable thead th[data-code],
    #perPersonTable tbody td[data-code] {
      min-width: 42px;
      width: 42px;
      text-align: center;
    }
    #perPersonTable {
      table-layout: auto;
    }

  
    /* ===== VERSIÓN SIMPLE / CELULAR ===== */
    html, body {
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
    }
    body {
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      margin: 0 auto;
      flex: 0 0 auto;
      width: 100%;
      padding-top: max(12px, env(safe-area-inset-top, 0px)) !important;
      padding-bottom: 6px;
      box-sizing: border-box;
    }
    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    header h1 { font-size: 1.05rem; }
    header p { display: none; }
    .view-original-btn { font-size: 0.72rem; padding: 6px 10px; }
    .json-btn {
      border: 0; border-radius: 6px; padding: 5px 8px;
      background: #1e3a5f; color: #fff; font-size: 0.68rem;
      font-weight: 700; cursor: pointer;
    }
    body:not(.is-admin) .admin-only { display: none !important; }
    .user-btn {

    // Ediciones locales: se guardan por mes (septiembre conserva su clave de siempre)

    let editsMap = {};

    function markComment(el, pi, di) {

    function setComment(pi, di, text) {

    }
    // Feriados del mes (índices 0-based). El admin los marca; se publican en el JSON.
    let feriados = [];
    let officialFeriados = [];
    function feriadosKey(mes) { return "cajFeriados:" + mes; }
    function normFeriados(list) {
      if (!Array.isArray(list)) return [];
      const out = [];
      list.forEach(v => {
        const n = Number(v);
        if (!Number.isFinite(n)) return;
        const di = Math.round(n) - 1; // siempre número de día del mes (1 = día 1)
        if (di >= 0 && di < DAYS && out.indexOf(di) < 0) out.push(di);
      });
      return out.sort((a, b) => a - b);
    }
    function loadFeriados() {
      officialFeriados = officialFeriados || [];
      try {
        const raw = localStorage.getItem(feriadosKey(currentMes));

      } catch (e) {}
      feriados = officialFeriados.slice();
    }
    function saveFeriados() {

    }
    function isFeriado(di) { return feriados.indexOf(di) !== -1; }
    // LU=0 ... DO=6. Si el día es feriado, manda la columna "domingo o feriado" (también un jueves feriado).
    function dayKind(di) {
      const wd = (MES.startWd + di) % 7;
      if (isFeriado(di) || wd === 6) return "dom";
      if (wd === 5) return "sab";
      if (wd === 3) return "jue";
      return "comun";
    }
    const OT_TABLE = {
      T3: { comun: 2.5, sab: 3.75, dom: 5, jue: 2.5 },
      TE: { comun: 2, sab: 2, dom: 2, jue: 2 },
      E:  { comun: 2, sab: 2, dom: 2, jue: 4 },
      E1: { comun: 2, sab: 2, dom: 2, jue: 2 },

    };
    function fmtHoras(n) {
      const r = Math.round(n * 100) / 100;
      let s = String(r);
      if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
      return s.replace(".", ",") + " h";
    }
    function dayKindOf(info, fers, di) {
      const wd = (info.startWd + di) % 7;

      if (wd === 3) return "jue";

    function prevMesKey(key) {
      const info = mesInfo(key);

    function monthScheduleList(key) {
      if (MES_DATA[key] && Array.isArray(MES_DATA[key].people) && MES_DATA[key].people.length) return MES_DATA[key].people;
      if (SEED_BY_MES[key]) return SEED_BY_MES[key];
      return null;
    }
    function monthHasSchedule(key) {
      const list = monthScheduleList(key);
      if (!list) return false;
      let edits = {};
      try { edits = JSON.parse(localStorage.getItem(editsKey(key)) || "{}"); } catch (e) {}
      if (edits && Object.keys(edits).length) return true;
      return list.some(p => (p.codes || []).some(c => String(c || "").trim()));
    }
    function feriadosInMonth(key) {
      const info = mesInfo(key);
      const toIdx = (list) => (list || []).map(n => Math.round(Number(n)) - 1).filter(d => d >= 0 && d < info.days);
      if (key === currentMes) return feriados.slice();
      try {

      const data = MES_DATA[key];

    function codesInMonth(key, id, mode) {
      const info = mesInfo(key);
      if (key === currentMes) {
        const pi = people.findIndex(p => String(p.id) === String(id));
        if (pi < 0) return Array(info.days).fill("");
        const src = mode === "actual" ? people[pi].codes : (ORIGINAL_CODES[pi] || []);
        return src.map(c => String(c || "").trim().toUpperCase());
      }
      const list = monthScheduleList(key) || [];
      const pi = list.findIndex(p => String(p.id) === String(id));
      const codes = Array(info.days).fill("");
      if (pi >= 0) {
        const raw = Array.isArray(list[pi].codes) ? list[pi].codes : [];
        raw.forEach((c, i) => { if (i < info.days) codes[i] = String(c || "").trim().toUpperCase(); });

          const epi = Number(parts[0]);
          const edi = Number(parts[1]);
          if (epi === pi && edi >= 0 && edi < info.days) codes[edi] = String(edits[k] || "").trim().toUpperCase();
        });
      }
      return codes;

    function payrollBounds(key) {

    }

      if (!b.bridged) return txt + " · sin programación de " + MES_NOMBRES[mesInfo(b.prev).m - 1];
      return txt;

    function overtimePeriod(id, mode) {
      const b = payrollBounds(currentMes);
      let total = 0;
      let prevMonth = 0;   // horas de días del mes anterior (26→fin)
      let currMonth = 0;   // horas de días del mes vigente (1→25)
      const ranges = b.bridged
        ? [[b.fromKey, b.fromDay, mesInfo(b.fromKey).days, "prev"], [b.toKey, 1, b.toDay, "curr"]]
        : [[b.toKey, b.fromDay, b.toDay, "curr"]];
      ranges.forEach(rg => {
        const key = rg[0];
        const fromDay = rg[1];
        const toDay = rg[2];
        const part = rg[3];
        const info = mesInfo(key);
        const codes = codesInMonth(key, id, mode);
        const fers = feriadosInMonth(key);
        for (let day = fromDay; day <= toDay && day <= info.days; day++) {
          const di = day - 1;
          const code = codes[di] || "";
          const row = OT_TABLE[code];
          if (!row) continue;
          const h = row[dayKindOf(info, fers, di)] || 0;
          if (!h) continue;
          total += h;
          if (part === "prev") prevMonth += h;
          else currMonth += h;
        }
      });
      return {
        total: total,
        prevMonth: prevMonth,
        currMonth: currMonth,
        bounds: b
      };
    }

    function buildRow(person, pi) {
      const tr = document.createElement("tr");
      tr.dataset.pi = String(pi);
      tr.innerHTML = `
        <td class="sticky-col person-id" data-pi="${pi}">${person.id}</td>
        <td class="sticky-col-2 person-name" data-pi="${pi}">${person.name}</td>
      `;
      const codesArr = codesFor(pi);
      const onlyDay = selectedDay !== null;
      let di = 0;
      while (di < codesArr.length) {
        if (onlyDay && di !== selectedDay) { di++; continue; }
        const code = codesArr[di];
        const upperCode = code ? code.toUpperCase() : "";
        const isBlock = code && BLOCK_CODES.includes(upperCode);
        const td = document.createElement("td");
        td.dataset.pi = String(pi);
        td.dataset.di = String(di);

        if (isBlock && !onlyDay) {
          let runEnd = di;
          while (
            runEnd + 1 < codesArr.length &&
            codesArr[runEnd + 1] &&
            codesArr[runEnd + 1].toUpperCase() === upperCode
          ) {
            runEnd++;
          }
          const runLen = runEnd - di + 1;
          td.dataset.code = upperCode;
          td.textContent = upperCode;
          td.className = "lao-block";
          markComment(td, pi, di);
          if (runLen > 1) td.colSpan = runLen;
          if (WEEK_START_DAYS.includes(di)) td.classList.add("week-sep");
          td.style.cursor = viewMode !== "actual" ? "default" : "pointer";
          if (cellWasEdited(pi, di, runEnd)) td.classList.add("edited");
          tr.appendChild(td);
          di = runEnd + 1;
          continue;
        }

        if (!code) {
          td.className = "empty";
          td.textContent = "·";
        } else {
          td.dataset.code = code;
          td.textContent = code;
        }
        markComment(td, pi, di);
        if (onlyDay) td.classList.add("day-only");
        if (WEEK_START_DAYS.includes(di)) td.classList.add("week-sep");
        td.style.cursor = viewMode !== "actual" ? "default" : "pointer";
        if (cellWasEdited(pi, di)) td.classList.add("edited");
        tr.appendChild(td);
        di++;
      }
      return tr;
    }


    function buildDayRow(person, pi) {
      const tr = document.createElement("tr");
      tr.dataset.pi = String(pi);

      const tdId = document.createElement("td");
      tdId.className = "sticky-col person-id";
      tdId.dataset.pi = String(pi);
      tdId.textContent = person.id;

      const tdName = document.createElement("td");
      tdName.className = "sticky-col-2 person-name";
      tdName.dataset.pi = String(pi);
      tdName.textContent = person.name;

      const codesArr = codesFor(pi);
      const code = (codesArr && codesArr[selectedDay]) ? String(codesArr[selectedDay]).toUpperCase() : "";

      const tdCode = document.createElement("td");
      tdCode.className = "day-only";
      tdCode.dataset.pi = String(pi);
      tdCode.dataset.di = String(selectedDay);
      if (!code) {
        tdCode.classList.add("empty");
        tdCode.textContent = "·";
      } else {
        tdCode.dataset.code = code;
        tdCode.textContent = code;
      }
      markComment(tdCode, pi, selectedDay);
      tdCode.style.cursor = viewMode !== "actual" ? "default" : "pointer";
      if (cellWasEdited(pi, selectedDay)) tdCode.classList.add("edited");

      tr.appendChild(tdId);
      tr.appendChild(tdName);
      tr.appendChild(tdCode);
      return tr;
    }

    const GROUPS = [
      { name: "Grupo 1", count: 10 },
      { name: "Grupo 2", count: 9 },
      { name: "Grupo 3", count: 10 },
      { name: "Grupo 4", count: 10 },
      { name: "Grupo 5", count: 10 },
      { name: "Grupo 6", count: 10 },
      { name: "Grupo 7", count: 10 }
    ];
    function groupIndexOf(pi) {
      let acc = 0;
      for (let i = 0; i < GROUPS.length; i++) {
        acc += GROUPS[i].count;
        if (pi < acc) return i;
      }
      return GROUPS.length - 1;
    }
    const g1 = document.getElementById("group1");
    const g2 = document.getElementById("group2");
    const daySplit = document.getElementById("daySplit");
    const scheduleTable = document.getElementById("scheduleTable");
    const dayBody1 = document.getElementById("dayBody1");
    const dayBody2 = document.getElementById("dayBody2");
    const dayHead1 = document.getElementById("dayHead1");
    const dayHead2 = document.getElementById("dayHead2");

    function groupTitleRow(text, count, cols) {
      const tr = document.createElement("tr");
      tr.className = "group-split";
      const td = document.createElement("td");
      td.colSpan = cols;
      td.textContent = text + " · " + count;
      tr.appendChild(td);
      return tr;
    }

    function fillDayHead(el, title) {
      const wknd = WEEKEND_DAYS.includes(selectedDay) ? " weekend" : "";
      const parts = DAY_LABELS[selectedDay].split(" ");
      const fer = isFeriado(selectedDay) ? " F" : "";
      el.innerHTML = `<tr>
        <th class="sticky-col">Leg.</th>
        <th class="sticky-col-2">${title}</th>
        <th class="day-only${wknd}${fer ? " feriado" : ""}">${parts[0]}<br><span class="day-num">${parts[1]}${fer}</span></th>
      </tr>`;
    }

    function applyDayHeaderFilter() {
      const bar = document.getElementById("dayFilterBar");
      document.body.classList.toggle("day-view", selectedDay !== null);
      document.body.classList.toggle("month-view", selectedDay === null);
      if (selectedDay === null) {
        if (dayHead1) dayHead1.innerHTML = "";
        if (dayHead2) dayHead2.innerHTML = "";
        if (dayBody1) dayBody1.innerHTML = "";
        if (dayBody2) dayBody2.innerHTML = "";
        if (bar) bar.style.display = "none";
      } else if (bar) {
        bar.style.display = "block";
        const lab = document.getElementById("dayFilterLabel");
        if (lab) lab.textContent = "Sólo " + DAY_LABELS[selectedDay];
        const sortBtn = document.getElementById("btnDaySort");
        if (sortBtn) sortBtn.textContent = daySortByShift ? "Orden lista" : "Por turno";
      }
    }

    function renderGroups() {
      if (selectedDay === null) {
        g1.innerHTML = "";
        g2.innerHTML = "";
        let acc = 0;
        people.forEach((p, pi) => {
          const gi = groupIndexOf(pi);
          const start = GROUPS.slice(0, gi).reduce((s, g) => s + g.count, 0);
          if (pi === start) {
            g1.appendChild(groupTitleRow(GROUPS[gi].name, GROUPS[gi].count, DAYS + 2));
          }
          g1.appendChild(buildRow(p, pi));
        });
      } else {
        dayBody1.innerHTML = "";
        dayBody2.innerHTML = "";
        fillDayHead(dayHead1, daySortByShift ? "Por turno" : "Lista");
        if (!daySortByShift) {
          let acc = 0;
          GROUPS.forEach((g, gi) => {
            const start = acc;
            const end = acc + g.count;
            acc = end;
            dayBody1.appendChild(groupTitleRow(g.name, g.count, 3));
            for (let pi = start; pi < end && pi < people.length; pi++) {
              dayBody1.appendChild(buildDayRow(people[pi], pi));
            }
          });
        } else {
          const ranked = [];
          people.forEach((p, pi) => {
            const codesArr = codesFor(pi);
            const code = (codesArr[selectedDay] || "").toUpperCase();
            if (DAY_VIEW_ORDER.indexOf(code) === -1) return;
            ranked.push({ pi, order: DAY_VIEW_ORDER.indexOf(code), code });
          });
          ranked.sort((a, b) => a.order - b.order || a.pi - b.pi);
          ranked.forEach((item) => {
            if (DAY_VIEW_ORDER.indexOf(item.code) === -1) return;
            dayBody1.appendChild(buildDayRow(people[item.pi], item.pi));
          });
        }
      }
      applyDayHeaderFilter();
    }
    function normCode(c) {
      if (c == null || c === "") return "";
      return String(c).trim().toUpperCase();
    }
    function normalizePeople(list) {
      return list.map(p => ({
        id: String(p.id || ""),
        name: p.name,
        codes: (Array.isArray(p.codes) ? p.codes.slice() : String(p.codes || "").split(/\s+/)).map(normCode)
      })).map(p => {
        while (p.codes.length < DAYS) p.codes.push("");
        p.codes = p.codes.slice(0, DAYS);
        return p;
      });
    }
    function applyCatalog(data) {
      if (!data || typeof data !== "object") return;
      if (Array.isArray(data.codigos) && data.codigos.length) {
        ALL_SHIFT_CODES = data.codigos.map(normCode).filter(Boolean);
      }
      if (data.colores && typeof data.colores === "object") {
        Object.keys(data.colores).forEach(k => {
          colorMap[normCode(k)] = data.colores[k];
        });
      }
    }

    // Trae el JSON de un mes (null si no existe o falla)
    async function fetchMes(key) {
      try {
        const r = await fetch(mesInfo(key).file + "?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return null;
        const data = await r.json();
        if (data && Array.isArray(data.people) && data.people.length) return data;
      } catch (e) {}
      return null;
    }

    // Arma el encabezado de días según el mes (cantidad de días y día de la semana del 1)
    function renderDayHead() {
      const row = document.getElementById("dayHeadRow");
      row.innerHTML = '<th class="sticky-col">Legajo</th><th class="sticky-col-2">Apellido</th>';
      for (let d = 0; d < DAYS; d++) {
        const wd = (MES.startWd + d) % 7;
        const th = document.createElement("th");
        th.dataset.di = String(d);
        const cls = [];
        if (wd >= 5) cls.push("weekend");
        if (wd === 0 && d > 0) cls.push("week-sep");
        if (isFeriado(d)) cls.push("feriado");
        th.className = cls.join(" ");
        th.title = isFeriado(d) ? "Feriado" : "";
        th.innerHTML = WEEKDAY_ABBR[wd] + '<br><span class="day-num">' + (d + 1) + (isFeriado(d) ? " F" : "") + "</span>";
        row.appendChild(th);
      }
    }

    // Deja todo listo para mostrar un mes: fechas, título, encabezado y ediciones locales
    function setMonthGlobals(key) {
      currentMes = key;
      MES = mesInfo(key);
      DAYS = MES.days;
      DAY_LABELS = [];
      WEEKEND_DAYS = [];
      WEEK_START_DAYS = [];
      for (let d = 0; d < DAYS; d++) {
        const wd = (MES.startWd + d) % 7;
        DAY_LABELS.push(WEEKDAY_ABBR[wd] + " " + (d + 1));
        if (wd >= 5) WEEKEND_DAYS.push(d);
        if (wd === 0 && d > 0) WEEK_START_DAYS.push(d);
      }
      document.documentElement.style.setProperty("--days-total", (DAYS * 42) + "px");
      document.getElementById("titleFull").textContent = "PROGRAMACIÓN CAJEROS — " + MES.nombre + " " + MES.y;
      document.getElementById("titleShort").textContent = MES.m + "/" + String(MES.y).slice(2);
      document.title = "Cajeros " + MES_ABR[MES.m - 1] + " " + MES.y;
      selectedDay = null;
      daySortByShift = false;
      loadEdits();
      loadComments();
      renderDayHead();
    }

    // Muestra un mes: usa el JSON publicado si existe, si no la semilla incluida en el HTML
    function switchMonth(key) {
      setMonthGlobals(key);
      const data = MES_DATA[key];
      ALL_SHIFT_CODES = DEFAULT_SHIFT_CODES.slice();
      officialFeriados = [];
      if (data) {
        applyCatalog(data);
        people = normalizePeople(data.people);
        loadNotesFromPeople(data.people);
        officialFeriados = normFeriados(data.feriados || []);
      } else {
        people = normalizePeople(SEED_BY_MES[key]);
      }
      loadFeriados();
      renderDayHead();
      ORIGINAL_CODES = people.map(p => p.codes.slice());
      if (SEED_BY_MES[key]) {
        INITIAL_CODES = normalizePeople(SEED_BY_MES[key]).map(p => p.codes.slice());
      } else {
        // Mes sin semilla: la primera versión publicada que vio este dispositivo queda como "inicial"
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem("cajInitial:" + key) || "null"); } catch (e) {}
        if (!Array.isArray(saved)) {
          saved = ORIGINAL_CODES.map(c => c.slice());
          try { localStorage.setItem("cajInitial:" + key, JSON.stringify(saved)); } catch (e) {}
        }
        INITIAL_CODES = saved;
      }
      resetPeopleFromOfficial();
      renderGroups();
      buildShiftGrid();
      applyColors();
    }

    // Vuelve a traer el JSON del mes que se está viendo (auto-actualización)
    async function loadSharedSchedule() {
      const mes = currentMes;
      const data = await fetchMes(mes);
      if (mes !== currentMes) return; // cambiaron de mes mientras cargaba
      if (data) {
        MES_DATA[mes] = data;
        applyCatalog(data);
        people = normalizePeople(data.people);
        loadNotesFromPeople(data.people);
        ORIGINAL_CODES = people.map(p => p.codes.slice());
        officialFeriados = normFeriados(data.feriados || []);
        if (localStorage.getItem(feriadosKey(mes)) == null) feriados = officialFeriados.slice();
        renderDayHead();
      }
      resetPeopleFromOfficial();
      renderGroups();
      buildShiftGrid();
      applyColors();
    }

    // ---- Meses disponibles ----
    const MES_DATA = {
      // Septiembre 2026 embebido (desde septiembre-2026.json)
      "2026-09": {
        mes: "2026-09",
        codigos: ["14F", "BLOQ", "DV", "E", "F", "FC", "IN", "LAO", "MD", "MS", "N", "NP", "T", "T3", "TE", "TP", "X"],
        colores: {"14F": "#334155", "BLOQ": "#8e2434", "DV": "#cccccc", "E": "#2E75B6", "F": "#FF6B6B", "FC": "#ffe0b2", "IN": "#fac090", "LAO": "#BF8F00", "MD": "#F79646", "MS": "#F8BBD0", "N": "#047857", "NP": "#cccccc", "T": "#FFFFFF", "T3": "#FFD966", "TE": "#92D050", "TP": "#cccccc", "X": "#7B1FA2"},
        feriados: [],
        people: null // se rellena abajo con SEED_SEP
      }
    };        // JSON publicado ya traído, por mes
    // Vincular people de septiembre a la semilla (misma referencia)
    MES_DATA["2026-09"].people = SEED_SEP;
    let AVAILABLE_MESES = [];

    function mesKeyOf(y, m) { return y + "-" + String(m).padStart(2, "0"); }
    // Meses a probar: desde 5 meses atrás (sin bajar de septiembre 2026) hasta 2 meses adelante
    function candidateMeses() {
      const now = new Date();
      const nowIdx = now.getFullYear() * 12 + now.getMonth();
      const [fy, fm] = FIRST_MES.split("-").map(Number);
      const start = Math.max(fy * 12 + fm - 1, nowIdx - 5);
      const end = Math.max(nowIdx + 2, 2026 * 12 + 9); // como mínimo hasta octubre 2026
      const out = [];
      for (let i = start; i <= end; i++) out.push(mesKeyOf(Math.floor(i / 12), (i % 12) + 1));
      return out;
    }

    function fillMonthSelect() {
      const sel = document.getElementById("monthSelect");
      sel.innerHTML = "";
      AVAILABLE_MESES.forEach(k => {
        const mi = mesInfo(k);
        const o = document.createElement("option");
        o.value = k;
        o.textContent = MES_ABR[mi.m - 1] + " " + mi.y;
        sel.appendChild(o);
      });
      sel.style.display = AVAILABLE_MESES.length > 1 ? "" : "none";
      sel.value = currentMes;
    }
    document.getElementById("monthSelect").addEventListener("change", (e) => {
      const key = e.target.value;
      try { sessionStorage.setItem("cajerosMes", key); } catch (err) {}
      switchMonth(key);
    });

    async function initApp() {
      const cands = candidateMeses();
      const results = await Promise.all(cands.map(k => fetchMes(k)));
      cands.forEach((k, i) => { if (results[i]) MES_DATA[k] = results[i]; });
      AVAILABLE_MESES = cands.filter(k => MES_DATA[k] || SEED_BY_MES[k]);
      if (!AVAILABLE_MESES.length) AVAILABLE_MESES = [FIRST_MES];
      let want = null;
      try { want = sessionStorage.getItem("cajerosMes"); } catch (e) {}
      if (!want || !AVAILABLE_MESES.includes(want)) {
        const now = new Date();
        const today = mesKeyOf(now.getFullYear(), now.getMonth() + 1);
        want = AVAILABLE_MESES.includes(today) ? today : AVAILABLE_MESES[AVAILABLE_MESES.length - 1];
      }
      switchMonth(want);
      fillMonthSelect();
    }
    initApp();

    // Auto-actualización: cada cierto tiempo vuelve a traer el JSON del mes que se está viendo,
    // así los dispositivos que ya tienen la página abierta reciben los cambios solos.
    const AUTO_REFRESH_MS = 3 * 60 * 1000; // cada 3 minutos
    setInterval(() => {
      const openOverlay = document.querySelector(".palette-overlay.open, #loginOverlay.open");
      if (openOverlay) return; // no interrumpir si hay un modal abierto (editando un turno, login, etc.)
      loadSharedSchedule();
    }, AUTO_REFRESH_MS);

    // Además de traer el JSON, cada cierto tiempo recarga la página entera saltando
    // la caché del celular. Esto asegura que si el propio HTML/código cambió (no solo
    // los datos), el celular lo termine tomando solo sin que haya que reinstalarla.
    const FULL_RELOAD_MS = 20 * 60 * 1000; // cada 20 minutos
    setInterval(() => {
      const openOverlay = document.querySelector(".palette-overlay.open, #loginOverlay.open");
      if (openOverlay) return;
      location.replace(location.pathname + "?v=" + Date.now());
    }, FULL_RELOAD_MS);

    let currentUser = sessionStorage.getItem("cajerosUser") || "";

    function currentJson() {
      return {
        mes: currentMes,
        codigos: ALL_SHIFT_CODES.slice(),
        colores: Object.assign({}, colorMap),
        feriados: feriados.map(d => d + 1),
        people: people.map((p, pi) => {
          const notes = [];
          for (let d = 0; d < DAYS; d++) notes.push(getComment(pi, d) || "");
          const row = { id: p.id, name: p.name, codes: p.codes.slice() };
          if (notes.some(Boolean)) row.notes = notes;
          return row;
        })
      };
    }
    document.getElementById("btnExportJson").addEventListener("click", async () => {
      const jsonText = JSON.stringify(currentJson(), null, 2);
      const blob = new Blob([jsonText], { type: "application/json" });

      // En el celular, "compartir" es más confiable que la descarga (Safari suele
      // abrir el JSON como texto en vez de guardarlo con el attribute "download").
      let file = null;
      try { file = new File([blob], MES.file, { type: "application/json" }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: MES.file });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return; // el usuario canceló el panel de compartir
        }
      }

      // Escritorio / navegadores sin Web Share: descarga normal
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = MES.file;
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById("btnCopyJson").addEventListener("click", async () => {
      const jsonText = JSON.stringify(currentJson(), null, 2);
      const btn = document.getElementById("btnCopyJson");
      const marcarCopiado = () => {
        const prev = btn.textContent;
        btn.textContent = "✓ Copiado";
        setTimeout(() => { btn.textContent = prev; }, 1500);
      };
      try {
        await navigator.clipboard.writeText(jsonText);
        marcarCopiado();
      } catch (err) {
        // Fallback para navegadores que no permiten el portapapeles moderno
        const ta = document.createElement("textarea");
        ta.value = jsonText;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand("copy"); marcarCopiado(); } catch (e2) {
          alert("No se pudo copiar automáticamente. Mantené presionado el botón ↓ JSON y usá \"Compartir\".");
        }
        document.body.removeChild(ta);
      }
    });
    document.getElementById("btnImportJson").addEventListener("click", () => {
      document.getElementById("importJsonFile").click();
    });
    document.getElementById("importJsonFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const list = Array.isArray(data) ? data : data.people;
          if (!list || !list.length) throw new Error("sin people");
          if (data.mes && data.mes !== currentMes &&
              !confirm("Este JSON es de " + data.mes + " pero estás viendo " + currentMes + ". ¿Importarlo igual?")) return;
          applyCatalog(data);
          people = normalizePeople(list);
          ORIGINAL_CODES = people.map(p => p.codes.slice());
          if (Array.isArray(data.feriados)) {
            feriados = normFeriados(data.feriados);
            officialFeriados = feriados.slice();
            saveFeriados();
          }
          editsMap = {};
          try { localStorage.removeItem(editsKey(currentMes)); } catch (err) {}
          renderGroups();
          applyColors();
          alert("JSON importado. Para que lo vean todos, subí ese mismo archivo a GitHub como " + MES.file);
        } catch (err) {
          alert("JSON inválido");
        }
      };
      reader.readAsText(file);
    });
    // ========== ABANICO DE TURNOS (reasignar el CT de una celda) ==========
    let shiftPersonIdx = null;
    let shiftDayIdx = null;
    const shiftOverlay = document.getElementById("shiftOverlay");
    const shiftGrid = document.getElementById("shiftGrid");
    const shiftPersonDay = document.getElementById("shiftPersonDay");

    function buildShiftGrid() {
      shiftGrid.innerHTML = "";
      ALL_SHIFT_CODES.forEach(code => {
        const opt = document.createElement("div");
        opt.className = "shift-option";
        opt.dataset.code = code;
        opt.textContent = code;
        let bg = colorMap[code];
        if (!bg && code === "POK") bg = colorMap["T/P"] || colorMap["INT/P"] || colorMap["N/P"];
        if (bg) {
          opt.style.background = bg;
          opt.style.color = getTextColor(bg);
        }
        opt.addEventListener("click", () => applyShift(code));
        shiftGrid.appendChild(opt);
      });
    }
    buildShiftGrid();

    function horasExtraDeTurno(code, di) {
      const row = OT_TABLE[String(code || "").trim().toUpperCase()];
      if (!row) return 0;
      return row[dayKind(di)] || 0;
    }
    function actualizarHorasExtraTurno() {
      const el = document.getElementById("shiftOt");
      if (!el || shiftPersonIdx == null || shiftDayIdx == null) return;
      const code = (people[shiftPersonIdx].codes[shiftDayIdx] || "").trim().toUpperCase();
      const he = horasExtraDeTurno(code, shiftDayIdx);
      const kind = dayKind(shiftDayIdx);
      const kindTxt = kind === "dom" ? "domingo o feriado" : kind === "sab" ? "sábado" : kind === "jue" ? "jueves" : "día común";
      el.textContent = he
        ? ("Horas extra de este turno: " + fmtHoras(he) + " · " + code + " · " + kindTxt)
        : ("Horas extra de este turno: 0 h" + (code ? " · " + code : ""));
    }
    function openShiftPicker(pi, di) {
      if (viewMode !== "actual") return;
      shiftPersonIdx = pi;
      shiftDayIdx = di;
      const person = people[pi];
      shiftPersonDay.textContent = `${person.name} · día ${di + 1}`;
      actualizarHorasExtraTurno();
      document.querySelectorAll(".shift-option").forEach(el => {
        el.classList.toggle("selected", el.dataset.code === person.codes[di]);
      });
      const cEl = document.getElementById("shiftComment");
      if (cEl) cEl.value = getComment(pi, di);
      shiftOverlay.classList.add("open");
      // El casillero del almanaque individual empieza a titilar inmediatamente.
      markPendingCalendarCell(pi, di);
    }
    function saveShiftComment() {
      if (shiftPersonIdx == null || shiftDayIdx == null) return;
      const cEl = document.getElementById("shiftComment");
      if (!cEl) return;
      setComment(shiftPersonIdx, shiftDayIdx, cEl.value);
    }

    function saveEdit(pi, di, code) {
      editsMap[pi + ":" + di] = code;
      try { localStorage.setItem(editsKey(currentMes), JSON.stringify(editsMap)); } catch (e) {}
    }
    function removeEdit(pi, di) {
      delete editsMap[pi + ":" + di];
      try { localStorage.setItem(editsKey(currentMes), JSON.stringify(editsMap)); } catch (e) {}
    }

    function refreshAfterEdit() {
      renderGroups();
      buildShiftGrid();
      applyColors();
      try { actualizarHorasExtraTurno(); } catch (eOt) {}
      if (personOverlay.classList.contains("open") && shiftPersonIdx !== null) {
        openPersonCalendar(shiftPersonIdx);
        markPendingCalendarCell(shiftPersonIdx, shiftDayIdx);
      }
    }

    function applyShift(code) {
      people[shiftPersonIdx].codes[shiftDayIdx] = code;
      saveEdit(shiftPersonIdx, shiftDayIdx, code);
      saveShiftComment();
      refreshAfterEdit();
      // La ventana permanece abierta. Solo "Listo" la cierra.
    }

    document.getElementById("clearShift").addEventListener("click", () => {
      people[shiftPersonIdx].codes[shiftDayIdx] = "";
      saveEdit(shiftPersonIdx, shiftDayIdx, "");
      saveShiftComment();
      refreshAfterEdit();
      // La ventana permanece abierta. Solo "Listo" la cierra.
    });

    document.getElementById("restoreShift").addEventListener("click", () => {
      const original = ORIGINAL_CODES[shiftPersonIdx][shiftDayIdx];
      people[shiftPersonIdx].codes[shiftDayIdx] = original;
      removeEdit(shiftPersonIdx, shiftDayIdx);
      saveShiftComment();
      refreshAfterEdit();
      // La ventana permanece abierta. Solo "Listo" la cierra.
    });

    document.getElementById("closeShift").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      saveShiftComment();
      refreshAfterEdit();
      closeShiftPicker();
    });

    document.getElementById("doneShift").addEventListener("click", () => {
      saveShiftComment();
      refreshAfterEdit();
      closeShiftPicker();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" && e.key !== "Enter") return;
      if (!shiftOverlay.classList.contains("open")) return;
      e.preventDefault();
      saveShiftComment();
      refreshAfterEdit();
      closeShiftPicker();
    });

    // Tampoco se cierra al tocar fuera de la ventana.
    shiftOverlay.addEventListener("click", (e) => {
      if (e.target === shiftOverlay) {
        e.preventDefault();
        e.stopPropagation();
      }
    });

    function closeShiftPicker() {
      shiftOverlay.classList.remove("open");
      // Al cerrar con "Listo", quitamos el titileo del casillero del almanaque.
      document.querySelectorAll(".cal-day.pending-shift, .cal-day-h.pending-shift").forEach(el => {
        el.classList.remove("pending-shift");
      });
      if (currentCalPi !== null && personOverlay.classList.contains("open")) {
        openPersonCalendar(currentCalPi);
      }
    }

    document.addEventListener("click", (e) => {
      if (viewMode !== "actual") return;
      if (e.target.closest("#shiftOverlay")) return;
      if (e.target.closest("thead")) return;
      const td = e.target.closest("td[data-pi][data-di]");
      if (!td) return;
      openShiftPicker(Number(td.dataset.pi), Number(td.dataset.di));
    });

    function toggleDayFilter(di) {
      if (selectedDay === di) {
        selectedDay = null;
        daySortByShift = false;
      } else {
        selectedDay = di;
        daySortByShift = false;
      }
      refreshAfterEdit();
    }
    document.getElementById("btnDaySort").addEventListener("click", () => {
      daySortByShift = !daySortByShift;
      refreshAfterEdit();
    });
    document.getElementById("dayHeadRow").addEventListener("click", (e) => {
      const th = e.target.closest("th[data-di]");
      if (!th) return;
      e.preventDefault();
      toggleDayFilter(Number(th.dataset.di));
    });
    document.getElementById("btnClearDay").addEventListener("click", () => {
      selectedDay = null;
      daySortByShift = false;
      refreshAfterEdit();
    });

    // ========== VER PROGRAMACIÓN ACTUAL / OFICIAL / INICIAL ==========
    // Un solo botón cicla entre los 3 modos, para no ocupar más lugar en la barra:
    //   A = Actual (editable)
    //   O = Oficial (la última que se publicó en GitHub, solo lectura)
    //   I = Inicial (la programación de arranque del mes, solo lectura)
    const VIEW_MODE_ORDER = ["actual", "oficial", "inicial"];
    const VIEW_MODE_LABEL = { actual: "A", oficial: "O", inicial: "I" };
    const VIEW_MODE_TITLE = {
      actual: "Actual (editable)",
      oficial: "Oficial (última publicada)",
      inicial: "Programación inicial del mes"
    };
    const VIEW_MODE_COLOR = { actual: "#7c3aed", oficial: "#5b21b6", inicial: "#0f766e" };
    const btnOriginalView = document.getElementById("btnOriginalView");
    btnOriginalView.addEventListener("click", () => {
      const order = currentUser === "ADMIN" ? VIEW_MODE_ORDER : ["actual", "oficial"];
      const next = order[(order.indexOf(viewMode) + 1) % order.length];
      viewMode = next;
      btnOriginalView.textContent = VIEW_MODE_LABEL[next];
      btnOriginalView.title = VIEW_MODE_TITLE[next];
      btnOriginalView.style.background = VIEW_MODE_COLOR[next];
      refreshAfterEdit();
    });

    // Toggle: ocultar apellido, dejar solo legajo
    const btnToggleNames = document.getElementById("btnToggleNames");
    let namesHidden = false;
    try { namesHidden = localStorage.getItem("cajerosHideNames") === "1"; } catch (e) {}
    function applyNamesHidden() {
      document.body.classList.toggle("names-hidden", namesHidden);
      if (btnToggleNames) {
        btnToggleNames.textContent = namesHidden ? "L" : "N";
        btnToggleNames.title = namesHidden ? "Mostrar nombres" : "Ocultar nombres";
        btnToggleNames.classList.toggle("on", namesHidden);
      }
    }
    applyNamesHidden();
    if (btnToggleNames) {
      btnToggleNames.addEventListener("click", () => {
        namesHidden = !namesHidden;
        try { localStorage.setItem("cajerosHideNames", namesHidden ? "1" : "0"); } catch (e) {}
        applyNamesHidden();
      });
    }

    const personOverlay = document.getElementById("personOverlay");
    const personCalTitle = document.getElementById("personCalTitle");
    const personCalGrid = document.getElementById("personCalGrid");
    const personCalRow = document.getElementById("personCalRow");
    const btnToggleCalView = document.getElementById("btnToggleCalView");

    let calViewMode = "grid"; // "grid" (almanaque) u "horizontal" (fila única)
    try { calViewMode = localStorage.getItem("cajerosCalView") || "grid"; } catch (e) {}

    let currentCalPi = null;

    function applyCalViewMode() {
      const isRow = calViewMode === "horizontal";
      personCalGrid.style.display = isRow ? "none" : "grid";
      personCalRow.classList.toggle("open", isRow);
      document.querySelector(".person-cal-modal").classList.toggle("wide", isRow);
      btnToggleCalView.textContent = isRow ? "▦" : "↔";
      btnToggleCalView.title = isRow ? "Ver como almanaque" : "Ver horizontal";
    }

    function openPersonCalendar(pi) {
      currentCalPi = pi;
      const person = people[pi];
      const codesArr = codesFor(pi);
      personCalTitle.textContent = person.name + " · " + person.id;

      // Vista almanaque (grilla de 7 columnas)
      let gridHtml = WEEKDAY_ABBR.map(d => `<div class="cal-wd">${d}</div>`).join("");
      for (let i = 0; i < MES.startWd; i++) gridHtml += `<div class="cal-empty"></div>`;
      for (let d = 0; d < DAYS; d++) {
        const code = codesArr[d] || "";
        const bg = code ? (colorMap[code] || "#e2e8f0") : "#f8fafc";
        const fg = code ? getTextColor(bg) : "#94a3b8";
        const edited = viewMode === "actual" && (codesArr[d] || "") !== (ORIGINAL_CODES[pi][d] || "");
        const cmtG = getComment(pi, d);
        const hasC = cmtG ? " has-comment" : "";
        const titleG = cmtG ? cmtG.replace(/"/g, "&quot;") : "";
        const dotG = cmtG ? '<span class="comment-dot"></span>' : "";
        const pendingG = shiftOverlay.classList.contains("open") && shiftPersonIdx === pi && shiftDayIdx === d ? " pending-shift" : "";
        const nextG = (d + 1) > 25 ? " ot-next" : "";
        gridHtml += `<div class="cal-day${edited ? " edited" : ""}${hasC}${pendingG}${nextG}" data-pi="${pi}" data-di="${d}" style="background:${bg};color:${fg}" title="${titleG}">
          <span class="cal-num">${d + 1}</span>
          <span class="cal-code">${code || "·"}</span>${dotG}
        </div>`;
      }
      personCalGrid.innerHTML = gridHtml;

      // Vista horizontal (una fila con todos los días, para leer el mes de corrido)
      let rowHtml = "";
      for (let d = 0; d < DAYS; d++) {
        const code = codesArr[d] || "";
        const bg = code ? (colorMap[code] || "#e2e8f0") : "#f8fafc";
        const fg = code ? getTextColor(bg) : "#94a3b8";
        const edited = viewMode === "actual" && (codesArr[d] || "") !== (ORIGINAL_CODES[pi][d] || "");
        const wd = WEEKDAY_ABBR[(MES.startWd + d) % 7];
        const cmtH = getComment(pi, d);
        const hasCH = cmtH ? " has-comment" : "";
        const titleH = cmtH ? cmtH.replace(/"/g, "&quot;") : "";
        const dotH = cmtH ? '<span class="comment-dot"></span>' : "";
        const pendingH = shiftOverlay.classList.contains("open") && shiftPersonIdx === pi && shiftDayIdx === d ? " pending-shift" : "";
        const nextH = (d + 1) > 25 ? " ot-next" : "";
        rowHtml += `<div class="cal-day-h${edited ? " edited" : ""}${hasCH}${pendingH}${nextH}" data-pi="${pi}" data-di="${d}" style="background:${bg};color:${fg}" title="${titleH}">
          <span class="cal-wd-h">${wd}</span>
          <span class="cal-num-h">${d + 1}</span>
          <span class="cal-code-h">${code || "·"}</span>${dotH}
        </div>`;
      }
      personCalRow.innerHTML = rowHtml;

      personCalGrid.querySelectorAll(".cal-day[data-pi][data-di]").forEach(el => {
        markComment(el, Number(el.dataset.pi), Number(el.dataset.di));
      });
      personCalRow.querySelectorAll(".cal-day-h[data-pi][data-di]").forEach(el => {
        markComment(el, Number(el.dataset.pi), Number(el.dataset.di));
      });

      applyCalViewMode();
      renderOtSummary(pi);
      personOverlay.classList.add("open");
    }
    function renderOtSummary(pi) {
      const el = document.getElementById("personOtSummary");
      if (!el) return;
      const id = people[pi] ? people[pi].id : "";
      const prog = overtimePeriod(id, "oficial");
      const camb = overtimePeriod(id, "actual");
      const delta = Math.round((camb.total - prog.total) * 100) / 100;
      const deltaTxt = delta === 0 ? "sin diferencia" : ((delta > 0 ? "+" : "") + fmtHoras(delta).replace(" h", "") + " h");
      const b = prog.bounds;
      const changed = prog.total !== camb.total ? " changed" : "";
      function notaPrev(ot) {
        if (!b.bridged) {
          return '<div class="ot-note">Período sin mes anterior cargado · solo días 1–25</div>';
        }
        const prevNom = MES_NOMBRES[mesInfo(b.prev).m - 1];
        const currNom = MES_NOMBRES[mesInfo(currentMes).m - 1];
        const prevH = Math.round((ot.prevMonth || 0) * 100) / 100;
        const currH = Math.round((ot.currMonth || 0) * 100) / 100;
        if (!prevH && !currH) {
          return '<div class="ot-note">Período 26 ' + prevNom + ' → 25 ' + currNom + '</div>';
        }
        return '<div class="ot-note">'
          + fmtHoras(prevH) + ' del mes anterior (26–fin ' + prevNom + ')'
          + ' · '
          + fmtHoras(currH) + ' de ' + currNom + ' (1–25)'
          + '</div>';
      }
      el.innerHTML = `<div class="ot-card">
          <div class="ot-label">Horas extras programadas</div>
          <div class="ot-nums">${fmtHoras(prog.total)}</div>
          ${notaPrev(prog)}
        </div>
        <div class="ot-card${changed}">
          <div class="ot-label">Horas extras con cambios</div>
          <div class="ot-nums">${fmtHoras(camb.total)}</div>
          ${notaPrev(camb)}
        </div>`;
      if (b.bridged && !MES_DATA[b.fromKey]) {
        fetchMes(b.fromKey).then(data => {
          if (!data || currentCalPi !== pi) return;
          MES_DATA[b.fromKey] = data;
          if (personOverlay.classList.contains("open")) renderOtSummary(pi);
        });
      }
    }
    function markPendingCalendarCell(pi, di) {
      // El titileo se aplica al casillero del ALMANAQUE INDIVIDUAL,
      // no al botón de turno de la ventana de edición.
      document.querySelectorAll(".cal-day.pending-shift, .cal-day-h.pending-shift").forEach(el => {
        el.classList.remove("pending-shift");
      });
      if (pi == null || di == null) return;
      document.querySelectorAll(`.cal-day[data-pi="${pi}"][data-di="${di}"], .cal-day-h[data-pi="${pi}"][data-di="${di}"]`)
        .forEach(el => el.classList.add("pending-shift"));
    }

    function closePersonCalendar() {
      personOverlay.classList.remove("open");
    }
    btnToggleCalView.addEventListener("click", () => {
      calViewMode = calViewMode === "horizontal" ? "grid" : "horizontal";
      try { localStorage.setItem("cajerosCalView", calViewMode); } catch (e) {}
      applyCalViewMode();
    });
    document.getElementById("closePersonCal").addEventListener("click", closePersonCalendar);
    personOverlay.addEventListener("click", (e) => {
      if (e.target === personOverlay) closePersonCalendar();
    });
    personCalGrid.addEventListener("click", (e) => {
      const cell = e.target.closest(".cal-day[data-di]");
      if (!cell || viewMode !== "actual") return;
      openShiftPicker(Number(cell.dataset.pi), Number(cell.dataset.di));
    });
    personCalRow.addEventListener("click", (e) => {
      const cell = e.target.closest(".cal-day-h[data-di]");
      if (!cell || viewMode !== "actual") return;
      openShiftPicker(Number(cell.dataset.pi), Number(cell.dataset.di));
    });

    document.addEventListener("click", (e) => {
      const cell = e.target.closest("td.person-name, td.person-id");
      if (!cell) return;
      openPersonCalendar(Number(cell.dataset.pi));
    });

    function renderFeriadosGrid() {
      const grid = document.getElementById("feriadosGrid");
      if (!grid) return;
      let html = WEEKDAY_ABBR.map(d => `<div class="fer-wd">${d}</div>`).join("");
      for (let i = 0; i < MES.startWd; i++) html += `<div></div>`;
      for (let d = 0; d < DAYS; d++) {
        const wd = (MES.startWd + d) % 7;
        const on = isFeriado(d) ? " on" : "";
        const wk = wd >= 5 ? " weekend" : "";
        html += `<button type="button" class="fer-day${on}${wk}" data-di="${d}">${d + 1}</button>`;
      }
      grid.innerHTML = html;
    }
    function openFeriados() {
      if (currentUser !== "ADMIN") return;
      renderFeriadosGrid();
      document.getElementById("feriadosOverlay").classList.add("open");
    }
    document.getElementById("btnFeriados").addEventListener("click", openFeriados);
    document.getElementById("closeFeriados").addEventListener("click", () => {
      document.getElementById("feriadosOverlay").classList.remove("open");
    });
    document.getElementById("doneFeriados").addEventListener("click", () => {
      document.getElementById("feriadosOverlay").classList.remove("open");
      renderDayHead();
      refreshAfterEdit();
    });
    document.getElementById("feriadosOverlay").addEventListener("click", (e) => {
      if (e.target.id === "feriadosOverlay") document.getElementById("feriadosOverlay").classList.remove("open");
    });
    document.getElementById("feriadosGrid").addEventListener("click", (e) => {
      const btn = e.target.closest(".fer-day[data-di]");
      if (!btn) return;
      const di = Number(btn.dataset.di);
      const i = feriados.indexOf(di);
      if (i >= 0) feriados.splice(i, 1);
      else feriados.push(di);
      feriados.sort((a, b) => a - b);
      saveFeriados();
      renderFeriadosGrid();
      renderDayHead();
      if (personOverlay.classList.contains("open") && currentCalPi !== null) openPersonCalendar(currentCalPi);
    });
    document.getElementById("clearFeriados").addEventListener("click", () => {
      feriados = [];
      saveFeriados();
      renderFeriadosGrid();
      renderDayHead();
      if (personOverlay.classList.contains("open") && currentCalPi !== null) openPersonCalendar(currentCalPi);
    });

</script>
</body>
</html>
